server {
    listen 10.77.0.10:80;
    server_name assistant.bzbgear.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 10.77.0.10:443 ssl;
    server_name assistant.bzbgear.com;
    # During DNS propagation, the previous VPS forwards visitors here.
    set_real_ip_from 209.159.152.124;
    ssl_certificate /etc/letsencrypt/live/assistant.bzbgear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistant.bzbgear.com/privkey.pem;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
