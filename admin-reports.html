<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Advisor reports</title>
  <style>
    :root{--ink:#15191f;--muted:#637083;--line:#dfe4ea;--panel:#fff;--wash:#f3f5f7;--yellow:#ffc20a;--blue:#eaf3ff;--navy:#102748}
    *{box-sizing:border-box} body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:30px}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
    h1{font-size:30px;line-height:1.1;margin:0 0 6px;letter-spacing:-.7px}.sub{color:var(--muted)}
    .brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--yellow);font-size:22px}
    .filters{display:grid;grid-template-columns:170px 170px minmax(220px,1fr) 130px auto;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
    label{display:grid;gap:6px;color:var(--muted);font-size:13px}input,select{width:100%;height:42px;padding:0 12px;border:1px solid #cfd6df;border-radius:8px;background:white;color:var(--ink)}
    input:focus{outline:3px solid #dcecff;border-color:#6aa7e8}.apply{align-self:end;height:42px;padding:0 22px;border:0;border-radius:8px;background:var(--navy);color:white;font-weight:700}
    .quick{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 20px}.quick button{border:1px solid var(--line);background:white;border-radius:20px;padding:6px 11px;color:#344052}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font-size:24px;letter-spacing:-.4px}.stat span{color:var(--muted);font-size:13px}
    .sessions{display:grid;gap:10px}.session{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.session summary{list-style:none;display:grid;grid-template-columns:180px 135px minmax(250px,1fr) 100px 105px 22px;gap:16px;align-items:center;padding:16px 18px;cursor:pointer}.session summary::-webkit-details-marker{display:none}
    .session[open] summary{border-bottom:1px solid var(--line)}.time{font-weight:700}.ip{font:13px Consolas,monospace}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#344052}.money{font-weight:800}.chev{font-size:19px;transition:transform .15s}.session[open] .chev{transform:rotate(90deg)}
    .body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;padding:20px;background:#fafbfc}.transcript{display:grid;gap:12px}.msg{max-width:82%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:white;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{justify-self:end;background:var(--blue);border-color:#cfe0f4}.role{display:block;margin-bottom:4px;color:var(--muted);font-size:12px;font-weight:700}.output{padding:14px;border-left:3px solid var(--yellow);background:#fffbed;border-radius:4px 10px 10px 4px}.output h4{margin:0 0 8px}.sku{display:inline-block;margin:3px 5px 3px 0;padding:3px 7px;border-radius:5px;background:white;border:1px solid #ead98d;font-size:12px}
    .meta{align-self:start;border:1px solid var(--line);border-radius:10px;background:white;padding:14px}.meta dl{display:grid;grid-template-columns:1fr auto;gap:8px;margin:0}.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:700}.customer-view{width:100%;margin-top:14px;padding:9px;border:0;border-radius:7px;background:var(--navy);color:white;font-weight:700}.raw summary{display:block!important;padding:8px 0!important;border:0!important;color:#365f91}.raw pre{max-height:260px;overflow:auto;padding:10px;background:#15191f;color:#dbe6f4;border-radius:8px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap}
    .pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:16px}.pager button{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 14px}.pager button:disabled{opacity:.4;cursor:default}.empty,.error{padding:40px;text-align:center;background:white;border:1px solid var(--line);border-radius:12px}.error{color:#9d1c1c}.loading{opacity:.55;pointer-events:none}
    .viewer{position:fixed;inset:0;z-index:50;background:rgba(10,18,29,.72);display:none;place-items:center;padding:24px}.viewer.open{display:grid}.viewer-window{width:min(1100px,100%);height:min(850px,calc(100vh - 48px));display:grid;grid-template-rows:auto 1fr;background:#f5f7f9;border-radius:18px;overflow:hidden;box-shadow:0 26px 80px rgba(0,0,0,.35)}.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;background:#15191f;color:white}.viewer-head b{font-size:19px}.viewer-close{width:38px;height:38px;border:0;border-radius:50%;background:#2a3038;color:white;font-size:23px}.viewer-chat{overflow:auto;padding:24px 7%;display:grid;align-content:start;gap:16px}.viewer-msg{display:flex;gap:10px;align-items:flex-start}.viewer-msg.user{justify-content:flex-end}.viewer-bubble{max-width:76%;padding:13px 16px;border-radius:16px;background:white;border:1px solid var(--line);white-space:pre-wrap}.viewer-msg.user .viewer-bubble{background:#e7f2ff;border-color:#c9dff6}.avatar{display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:50%;background:#171b21;color:var(--yellow);font-weight:900}.viewer-result{margin-left:48px;padding:15px 17px;border:1px solid #e7d27d;border-radius:13px;background:#fffbed}.viewer-result h4{margin:0 0 8px}
    @media(max-width:900px){.shell{padding:16px}.filters{grid-template-columns:1fr 1fr}.filters label:nth-child(3){grid-column:1/-1}.stats{grid-template-columns:1fr 1fr}.session summary{grid-template-columns:1fr auto}.session summary>*:nth-child(3),.session summary>*:nth-child(4){display:none}.body{grid-template-columns:1fr}.meta{order:-1}.msg{max-width:94%}}
  </style>
</head>
<body><main class="shell" id="app">
  <header><div class="brand"><div class="mark">✦</div><div><h1>AI Advisor reports</h1><div class="sub">Full conversations, product output and estimated API cost</div></div></div><div class="sub">Times shown in Pacific Time</div></header>
  <form class="filters" id="filters">
    <label>From date<input id="from" type="date" required></label>
    <label>To date<input id="to" type="date" required></label>
    <label>IP address<input id="ip" placeholder="Exact or partial IP"></label><label>Rows per page<select id="pageSize"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></label>
    <button class="apply" type="submit">Apply filters</button>
  </form>
  <div class="quick"><button data-days="0">Today</button><button data-days="1">Yesterday</button><button data-days="7">Last 7 days</button><button data-days="30">Last 30 days</button></div>
  <section class="stats" id="stats"></section><nav class="pager" id="pagerTop"></nav><section class="sessions" id="sessions"></section><nav class="pager" id="pagerBottom"></nav>
</main>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Customer chat view"><div class="viewer-window"><div class="viewer-head"><div><b>BZBGEAR AI Advisor</b><div style="color:#aeb7c3;font-size:13px">Customer view · read only</div></div><button class="viewer-close" aria-label="Close">×</button></div><div class="viewer-chat" id="viewerChat"></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toFixed(4), num=n=>Number(n||0).toLocaleString(), dateOnly=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fmt=d=>new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(d));
let page=1,data=null; const today=dateOnly(new Date()); $('#from').value=today;$('#to').value=today;
$('.quick').addEventListener('click',e=>{if(!e.target.dataset.days)return;const n=+e.target.dataset.days,d=new Date();if(n===1){d.setDate(d.getDate()-1);$('#from').value=$('#to').value=dateOnly(d)}else{$('#to').value=today;d.setDate(d.getDate()-Math.max(0,n-1));$('#from').value=dateOnly(d)}page=1;load()});
$('#filters').addEventListener('submit',e=>{e.preventDefault();page=1;load()});
function resultHTML(r){const products=r.products||r.candidates||[];const skus=products.map(p=>typeof p==='string'?p:(p.id||p.sku)).filter(Boolean);const text=r.recommendation||r.content||r.message||r.text||'';return `<div class="output"><h4>${esc(r.topic||r.title||'Advisor output')}</h4>${text?`<div>${esc(text)}</div>`:''}${skus.length?`<div style="margin-top:8px">${skus.map(x=>`<span class="sku">${esc(x)}</span>`).join('')}</div>`:''}<details class="raw"><summary>Raw output</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details></div>`}
function sessionHTML(s){const first=(s.messages.find(m=>m.role==='user')||{}).content||'Conversation started';const messages=s.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'assistant'}"><span class="role">${m.role==='user'?'Customer':'AI Advisor'}</span>${esc(m.content)}</div>`).join('');return `<details class="session"><summary><span class="time">${fmt(s.started_at)}</span><span class="ip">${esc(s.ip)}</span><span class="preview">${esc(first)}</span><span>${s.message_count} messages</span><span class="money">${money(s.usage.cost_usd)}</span><span class="chev">›</span></summary><div class="body"><div class="transcript">${messages}${s.results.map(resultHTML).join('')||''}</div><aside class="meta"><dl><dt>Session</dt><dd title="${esc(s.session_id)}">${esc(s.session_id.slice(0,8))}…</dd><dt>IP</dt><dd>${esc(s.ip)}</dd><dt>Duration</dt><dd>${num(s.duration_seconds)} sec</dd><dt>API calls</dt><dd>${num(s.usage.api_calls)}</dd><dt>Input tokens</dt><dd>${num(s.usage.prompt_tokens)}</dd><dt>Cached tokens</dt><dd>${num(s.usage.cached_tokens)}</dd><dt>Output tokens</dt><dd>${num(s.usage.completion_tokens)}</dd><dt>Cost</dt><dd>${money(s.usage.cost_usd)}</dd></dl><button class="customer-view" data-session="${esc(s.session_id)}">View as customer</button></aside></div></details>`}
function viewerResult(r){const products=r.products||r.candidates||[],skus=products.map(p=>typeof p==='string'?p:(p.id||p.sku)).filter(Boolean),text=r.recommendation||r.content||r.message||r.text||'';return `<div class="viewer-result"><h4>${esc(r.topic||r.title||'Recommended products')}</h4>${text?`<div>${esc(text)}</div>`:''}${skus.length?`<div style="margin-top:10px">${skus.map(x=>`<span class="sku">${esc(x)}</span>`).join('')}</div>`:''}</div>`}
function showCustomer(id){const s=data.sessions.find(x=>x.session_id===id);if(!s)return;$('#viewerChat').innerHTML=s.messages.map(m=>m.role==='user'?`<div class="viewer-msg user"><div class="viewer-bubble">${esc(m.content)}</div><div class="avatar" style="color:white;background:#dce9f7">You</div></div>`:`<div class="viewer-msg"><div class="avatar">BZB</div><div class="viewer-bubble">${esc(m.content)}</div></div>`).join('')+s.results.map(viewerResult).join('');$('#viewer').classList.add('open');document.body.style.overflow='hidden'}
$('#sessions').addEventListener('click',e=>{const b=e.target.closest('.customer-view');if(b){e.preventDefault();showCustomer(b.dataset.session)}});function closeViewer(){$('#viewer').classList.remove('open');document.body.style.overflow=''}$('.viewer-close').onclick=closeViewer;$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer'))closeViewer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
function renderPager(target,p){target.innerHTML=`<button ${p.page<=1?'disabled':''} data-go="prev">Previous</button><span>Page ${p.page} of ${p.pages} · ${num(data.summary.sessions)} conversations</span><button ${p.page>=p.pages?'disabled':''} data-go="next">Next</button>`;target.onclick=e=>{const go=e.target.dataset.go;if(!go)return;page+=go==='next'?1:-1;load();scrollTo({top:0,behavior:'smooth'})}}
async function load(){const app=$('#app');app.classList.add('loading');const q=new URLSearchParams({from:$('#from').value,to:$('#to').value,ip:$('#ip').value,page,page_size:$('#pageSize').value});try{const r=await fetch('/admin/reports/data?'+q);if(!r.ok)throw new Error(await r.text());data=await r.json();const x=data.summary;$('#stats').innerHTML=`<div class="stat"><b>${num(x.sessions)}</b><span>Conversations</span></div><div class="stat"><b>${money(x.cost_usd)}</b><span>Total filtered cost</span></div><div class="stat"><b>${money(x.average_cost_usd)}</b><span>Average per conversation</span></div><div class="stat"><b>${num(x.api_calls)}</b><span>API calls</span></div><div class="stat"><b>${num(x.prompt_tokens+x.completion_tokens)}</b><span>Input + output tokens</span></div>`;$('#sessions').innerHTML=data.sessions.length?data.sessions.map(sessionHTML).join(''):'<div class="empty">No conversations match these filters.</div>';renderPager($('#pagerTop'),data.pagination);renderPager($('#pagerBottom'),data.pagination)}catch(e){$('#sessions').innerHTML=`<div class="error">Could not load reports: ${esc(e.message)}</div>`}finally{app.classList.remove('loading')}}
load();
</script></body></html>
