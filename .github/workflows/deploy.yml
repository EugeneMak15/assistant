name: Deploy Advisor to BZBGEAR VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: advisor-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up SSH deploy key
        env:
          DEPLOY_KEY: ${{ secrets.ADVISOR_DEPLOY_SSH_KEY }}
          BASTION_HOST_KEY: ${{ secrets.ADVISOR_BASTION_HOST_KEY }}
          WEB_HOST_KEY: ${{ secrets.ADVISOR_WEB_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/advisor_deploy
          chmod 600 ~/.ssh/advisor_deploy
          printf '%s\n%s\n' "$BASTION_HOST_KEY" "$WEB_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host advisor-bastion
            HostName 15.204.65.182
            User advisor-deploy
            IdentityFile ~/.ssh/advisor_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          Host advisor-web
            HostName 10.77.0.10
            User advisor-deploy
            IdentityFile ~/.ssh/advisor_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyJump advisor-bastion
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy through VPS bastion
        run: |
          set -euo pipefail
          ssh advisor-web sudo /usr/local/sbin/deploy-bzb-advisor "${GITHUB_SHA}"
