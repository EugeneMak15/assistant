name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd /opt/assistant
            git pull --ff-only origin main
            /opt/assistant/venv/bin/pip install -r requirements.txt -q
            /opt/assistant/venv/bin/python audit_catalog_specs.py --db products.db --apply --backup-dir _backup_predeploy
            systemctl restart bzb-assistant.service
            systemctl is-active --quiet bzb-assistant.service
            curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health
